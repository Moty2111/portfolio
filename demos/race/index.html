<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гонки – Стабильная версия</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #000;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 22px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 8px 18px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        #speed {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff5500;
            font-size: 60px;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(255,85,0,0.9);
            pointer-events: none;
            z-index: 10;
        }
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.65);
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }
        #restart {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #ff5500, #ff2200);
            color: white;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            transition: all 0.3s;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255,85,0,0.7);
        }
        #restart:hover {
            background: linear-gradient(135deg, #ff7722, #ff4400);
            transform: scale(1.07);
            box-shadow: 0 0 35px rgba(255,120,0,1);
        }
        .crash-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3333;
            font-size: 80px;
            font-weight: bold;
            text-shadow: 0 0 50px red;
            pointer-events: none;
            z-index: 15;
            animation: fadeOut 0.8s forwards;
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translate(-50%, -50%) scale(2.5); }
        }
    </style>
</head>
<body>
    <div id="ui">🏁 Круг <span id="lap">1</span>/3 | 🏆 Лучший круг: <span id="best">--</span>с</div>
    <div id="speed">0 км/ч</div>
    <div id="minimap"><canvas id="minimapCanvas" width="200" height="200"></canvas></div>
    <button id="restart">🔄 Заново</button>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.157.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ========== ПАРАМЕТРЫ ==========
        const PLAYER_MAX_SPEED = 200;
        const PLAYER_ACCEL = 65;
        const AI_MAX_SPEED_BASE = 160;
        const AI_SPEED_VARIATION = 40;
        const TRACK_WIDTH = 64;
        const TRACK_RADIUS = 330;
        const MAX_LAPS = 3;

        // ========== СЦЕНА (ДЕНЬ) ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 250, 850);

        const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 1000);
        camera.position.set(0, 30, -25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // ========== ОСВЕЩЕНИЕ ==========
        const sun = new THREE.DirectionalLight(0xffffff, 5.5);
        sun.position.set(300, 400, 150);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 1000;
        sun.shadow.camera.left = -400;
        sun.shadow.camera.right = 400;
        sun.shadow.camera.top = 400;
        sun.shadow.camera.bottom = -400;
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0xffffff, 1.8));
        scene.add(new THREE.HemisphereLight(0xffffff, 0x446633, 1.0));

        // ========== НЕБО (ОБЛАКА) ==========
        const cloudGeo = new THREE.SphereGeometry(1, 7, 7);
        const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8, transparent: true, opacity: 0.8 });
        for (let i = 0; i < 60; i++) {
            const group = new THREE.Group();
            const count = 3 + Math.floor(Math.random() * 5);
            for (let j = 0; j < count; j++) {
                const puff = new THREE.Mesh(cloudGeo, cloudMat);
                puff.position.set((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 4);
                puff.scale.setScalar(1.5 + Math.random() * 4);
                group.add(puff);
            }
            group.position.set((Math.random() - 0.5) * 800, 80 + Math.random() * 120, (Math.random() - 0.5) * 800);
            scene.add(group);
        }

        // ========== ТРАССА (РОВНАЯ) ==========
        function createAsphaltTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 2500; i++) {
                ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.4})`;
                ctx.beginPath(); ctx.arc(Math.random()*512, Math.random()*512, Math.random()*2, 0, 2*Math.PI); ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }
        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#3c6b2f';
            ctx.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 800; i++) {
                ctx.fillStyle = `rgba(${40+Math.random()*40},${100+Math.random()*60},${20+Math.random()*40},0.5)`;
                ctx.fillRect(Math.random()*256, Math.random()*256, 1, 1);
            }
            return new THREE.CanvasTexture(canvas);
        }
        const asphaltTex = createAsphaltTexture();
        asphaltTex.wrapS = asphaltTex.wrapT = THREE.RepeatWrapping;
        asphaltTex.repeat.set(0.5, 0.5);
        const grassTex = createGrassTexture();
        grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
        grassTex.repeat.set(20, 20);

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshStandardMaterial({ map: grassTex, color: 0x4a8c3f, roughness: 1.0 }));
        ground.rotation.x = -Math.PI/2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        const trackPath = [];
        const segments = 320;
        const rx = TRACK_RADIUS * 1.8;
        const rz = TRACK_RADIUS * 1.1;
        for (let i = 0; i < segments; i++) {
            const angle = (i / segments) * Math.PI * 2;
            trackPath.push(new THREE.Vector3(Math.cos(angle) * rx, 0, Math.sin(angle) * rz));
        }

        const trackGroup = new THREE.Group();
        scene.add(trackGroup);
        const trackMat = new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.7, color: 0xcccccc });
        const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, emissive: 0xffffff, emissiveIntensity: 0.3 });
        const curbMat = new THREE.MeshStandardMaterial({ color: 0xff3300, roughness: 0.4 });
        const curbMatWhite = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.4 });

        for (let i = 0; i < trackPath.length; i++) {
            const p1 = trackPath[i];
            const p2 = trackPath[(i+1)%trackPath.length];
            const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
            const dir = new THREE.Vector3().subVectors(p2, p1);
            const len = dir.length();
            const angle = Math.atan2(dir.x, dir.z);
            const segGeo = new THREE.PlaneGeometry(TRACK_WIDTH, len);
            const seg = new THREE.Mesh(segGeo, trackMat);
            seg.position.copy(mid);
            seg.position.y = 0.02;
            seg.rotation.x = -Math.PI/2;
            seg.rotation.z = angle;
            seg.receiveShadow = true;
            trackGroup.add(seg);
            if (i % 3 === 0) {
                const lineGeo = new THREE.PlaneGeometry(0.8, len * 0.7);
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.position.copy(mid);
                line.position.y = 0.04;
                line.rotation.x = -Math.PI/2;
                line.rotation.z = angle;
                trackGroup.add(line);
            }
            const perp = new THREE.Vector3(-dir.z, 0, dir.x).normalize();
            for (let side = -1; side <= 1; side += 2) {
                const curbPos = mid.clone().add(perp.clone().multiplyScalar(side * (TRACK_WIDTH/2 + 1.5)));
                const curbGeo = new THREE.BoxGeometry(2.0, 0.5, len);
                const curb = new THREE.Mesh(curbGeo, (i % 5 < 2) ? curbMat : curbMatWhite);
                curb.position.copy(curbPos);
                curb.position.y = 0.25;
                curb.rotation.y = angle;
                curb.castShadow = true;
                curb.receiveShadow = true;
                trackGroup.add(curb);
            }
        }

        // Барьеры
        const barrierMat = new THREE.MeshStandardMaterial({ color: 0x8899aa, roughness: 0.5, metalness: 0.6 });
        for (let i = 0; i < trackPath.length; i += 2) {
            const p1 = trackPath[i];
            const p2 = trackPath[(i+1)%trackPath.length];
            const dir = new THREE.Vector3().subVectors(p2, p1);
            const len = dir.length();
            const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
            const perp = new THREE.Vector3(-dir.z, 0, dir.x).normalize();
            const angle = Math.atan2(dir.x, dir.z);
            for (let side = -1; side <= 1; side += 2) {
                const wallPos = mid.clone().add(perp.clone().multiplyScalar(side * (TRACK_WIDTH/2 + 4.0)));
                const wallGeo = new THREE.BoxGeometry(1.0, 3.5, len);
                const wall = new THREE.Mesh(wallGeo, barrierMat);
                wall.position.copy(wallPos);
                wall.position.y = 1.75;
                wall.rotation.y = angle;
                wall.castShadow = true;
                wall.receiveShadow = true;
                trackGroup.add(wall);
            }
        }

        // Деревья с несколькими листьями
        const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x5c3a1e, roughness: 0.9 });
        const treeLeafMat = new THREE.MeshStandardMaterial({ color: 0x2d5a1e, roughness: 0.4 });
        for (let i = 0; i < 250; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = TRACK_RADIUS * 1.8 + Math.random() * 150;
            const x = Math.cos(angle) * dist * 1.8;
            const z = Math.sin(angle) * dist * 1.1;
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 7, 6), treeTrunkMat);
            trunk.position.set(x, 3.5, z);
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            trackGroup.add(trunk);
            const leaf1 = new THREE.Mesh(new THREE.ConeGeometry(3, 6, 8), treeLeafMat);
            leaf1.position.set(x, 9, z);
            leaf1.castShadow = true;
            trackGroup.add(leaf1);
            const leaf2 = new THREE.Mesh(new THREE.ConeGeometry(2.2, 5, 6), treeLeafMat);
            leaf2.position.set(x + 1.2, 7.5, z + 0.8);
            leaf2.castShadow = true;
            trackGroup.add(leaf2);
        }

        // ========== УЛУЧШЕННАЯ МАШИНА ==========
        function createDetailedCar(color) {
            const car = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.12, metalness: 0.85 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.8, 4.9), bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            body.receiveShadow = true;
            car.add(body);

            const skirt = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.15, 5.0), new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.5 }));
            skirt.position.y = 0.12;
            car.add(skirt);

            const hood = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.4, 1.8), bodyMat);
            hood.position.set(0, 0.95, 1.55);
            hood.castShadow = true;
            car.add(hood);

            const ventMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.2, metalness: 0.8 });
            car.add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 1.0), ventMat)).position.set(0.55, 1.15, 1.7);
            car.add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 1.0), ventMat)).position.set(-0.55, 1.15, 1.7);

            const headlightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2.5 });
            car.add(new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.25, 0.15), headlightMat)).position.set(0.85, 0.65, 2.45);
            car.add(new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.25, 0.15), headlightMat)).position.set(-0.85, 0.65, 2.45);

            const taillightMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 2.0 });
            car.add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.15), taillightMat)).position.set(0.85, 0.6, -2.45);
            car.add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.15), taillightMat)).position.set(-0.85, 0.6, -2.45);

            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x112233, roughness: 0.1, metalness: 0.95 });
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.55, 2.2), cabinMat);
            cabin.position.set(0, 1.2, -0.1);
            cabin.castShadow = true;
            car.add(cabin);

            const windowMat = new THREE.MeshStandardMaterial({ color: 0x88aacc, roughness: 0.05, emissive: 0x112244, emissiveIntensity: 0.4, transparent: true, opacity: 0.65 });
            car.add(new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.4, 0.15), windowMat)).position.set(0, 1.35, 0.9);
            car.add(new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.4, 0.15), windowMat)).position.set(0, 1.35, -1.1);

            const spoilerStand = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            car.add(spoilerStand.clone().position.set(0.85, 1.25, -2.0));
            car.add(spoilerStand.clone().position.set(-0.85, 1.25, -2.0));
            const wing = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.2, 0.8), new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.9 }));
            wing.position.set(0, 1.6, -2.15);
            wing.castShadow = true;
            car.add(wing);

            const exhaustGeo = new THREE.CylinderGeometry(0.12, 0.15, 0.8, 8);
            const exhaustMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.2, metalness: 0.95 });
            for (let side = -1; side <= 1; side += 2) {
                for (let j = -0.3; j <= 0.3; j += 0.6) {
                    const ex = new THREE.Mesh(exhaustGeo, exhaustMat);
                    ex.position.set(side * 0.7 + j, 0.35, -2.6);
                    ex.rotation.x = Math.PI/2;
                    car.add(ex);
                }
            }

            const flameGeo = new THREE.ConeGeometry(0.1, 0.6, 8);
            const flameMat = new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: 0xff4400, emissiveIntensity: 3 });
            const flameL = new THREE.Mesh(flameGeo, flameMat);
            flameL.position.set(0.7, 0.35, -3.0);
            flameL.rotation.x = Math.PI/2;
            car.add(flameL);
            const flameR = new THREE.Mesh(flameGeo, flameMat);
            flameR.position.set(-0.7, 0.35, -3.0);
            flameR.rotation.x = Math.PI/2;
            car.add(flameR);

            const wheelGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.6, 32);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
            const rimGeo = new THREE.TorusGeometry(0.4, 0.15, 8, 8);
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.1, metalness: 0.95 });
            const spokeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.7);
            const spokeMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.2, metalness: 0.9 });
            const wheelPositions = [
                { x: 1.2, z: 1.6, front: true },
                { x: -1.2, z: 1.6, front: true },
                { x: 1.2, z: -1.8, front: false },
                { x: -1.2, z: -1.8, front: false },
            ];
            const wheels = [];
            wheelPositions.forEach(({ x, z, front }) => {
                const group = new THREE.Group();
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI/2;
                wheel.castShadow = true;
                wheel.receiveShadow = true;
                group.add(wheel);
                const rim = new THREE.Mesh(rimGeo, rimMat);
                rim.rotation.z = Math.PI/2;
                group.add(rim);
                for (let k = 0; k < 5; k++) {
                    const spoke = new THREE.Mesh(spokeGeo, spokeMat);
                    spoke.rotation.z = (k / 5) * Math.PI * 2;
                    group.add(spoke);
                }
                group.position.set(x, 0.5, z);
                group.userData = { isFront: front };
                car.add(group);
                wheels.push(group);
            });

            car.userData = { wheels, body, flames: [flameL, flameR] };
            return car;
        }

        // ========== ФИЗИКА И УПРАВЛЕНИЕ ==========
        class CarPhysics {
            constructor(carMesh, isPlayer = false, aiConfig = null) {
                this.mesh = carMesh;
                this.isPlayer = isPlayer;
                this.speed = 0;
                this.angle = 0;
                this.position = new THREE.Vector3(0, 0, 0);
                this.steerAngle = 0;
                this.maxSpeed = isPlayer ? PLAYER_MAX_SPEED : AI_MAX_SPEED_BASE + Math.random() * AI_SPEED_VARIATION;
                this.acceleration = isPlayer ? PLAYER_ACCEL : 30 + Math.random() * 25;
                this.braking = 75;
                this.friction = 32;
                this.turnSpeed = 2.8;
                this.trackProgress = 0;
                this.lap = 1;
                this.lapTimes = [];
                this.lapStartTime = performance.now() / 1000;
                this.crashed = false;
                this.crashTimer = 0;
                this.ai = aiConfig ? new AIController(this, aiConfig) : null;
                this.flameTimer = 0;
            }

            update(dt, input, allCars) {
                if (this.crashed) {
                    this.crashTimer -= dt;
                    this.speed *= 0.88;
                    if (this.crashTimer <= 0) this.crashed = false;
                }
                if (this.isPlayer && input) {
                    const targetAccel = (input.forward ? 1 : 0) - (input.backward ? 0.7 : 0);
                    if (targetAccel !== 0) {
                        this.speed += (targetAccel * this.acceleration - this.speed * 0.06) * dt;
                    } else {
                        this.speed -= Math.sign(this.speed) * this.friction * dt;
                    }
                    if (input.brake) this.speed -= Math.sign(this.speed) * this.braking * dt;
                    const steerInput = (input.left ? 1 : 0) - (input.right ? 1 : 0);
                    const targetSteer = steerInput * 0.5;
                    this.steerAngle += (targetSteer - this.steerAngle) * Math.min(1, 4.0 * dt);
                } else if (this.ai) {
                    this.ai.update(dt, allCars);
                }

                this.speed = THREE.MathUtils.clamp(this.speed, -25, this.maxSpeed);
                const turnFactor = this.speed * 0.018;
                this.angle += this.steerAngle * turnFactor * this.turnSpeed * dt;
                const moveX = Math.sin(this.angle) * this.speed * dt;
                const moveZ = Math.cos(this.angle) * this.speed * dt;
                this.position.x += moveX;
                this.position.z += moveZ;
                this.position.y = 0.12; // ровная трасса
                this.mesh.position.copy(this.position);
                this.mesh.rotation.y = this.angle;

                const wheels = this.mesh.userData.wheels;
                wheels.forEach(w => {
                    w.children[0].rotation.x += this.speed * dt * 12;
                    if (w.userData.isFront) w.rotation.y = this.steerAngle * 0.7;
                });
                const body = this.mesh.userData.body;
                body.rotation.z = -this.steerAngle * 0.4;
                body.rotation.x = Math.abs(this.speed) * 0.004;

                if (this.mesh.userData.flames) {
                    this.flameTimer += dt;
                    const scale = 0.8 + Math.sin(this.flameTimer * 30) * 0.3;
                    this.mesh.userData.flames.forEach(f => {
                        f.scale.set(scale, 1, scale);
                        f.visible = Math.abs(this.speed) > 20;
                    });
                }

                this.checkTrackBounds();
            }

            findClosestPathIndex() {
                let minDist = Infinity, idx = 0;
                for (let i = 0; i < trackPath.length; i++) {
                    const d = this.position.distanceTo(trackPath[i]);
                    if (d < minDist) { minDist = d; idx = i; }
                }
                return idx;
            }

            checkTrackBounds() {
                const closestIdx = this.findClosestPathIndex();
                const dist = this.position.distanceTo(trackPath[closestIdx]);
                const maxAllowed = TRACK_WIDTH/2 + 2.5;
                if (dist > maxAllowed) {
                    const toCenter = trackPath[closestIdx].clone().sub(this.position).normalize();
                    this.position.add(toCenter.multiplyScalar(dist - maxAllowed + 0.3));
                    this.speed *= 0.8;
                    if (this.isPlayer && !this.crashed) {
                        this.crashed = true;
                        this.crashTimer = 0.2;
                        this.showCrashEffect();
                    }
                }
                if (this.isPlayer) {
                    const newProgress = closestIdx / trackPath.length;
                    if (this.trackProgress > 0.85 && newProgress < 0.15) {
                        const lapTime = performance.now() / 1000 - this.lapStartTime;
                        this.lapTimes.push(lapTime);
                        this.lap++;
                        this.lapStartTime = performance.now() / 1000;
                        if (this.lap > MAX_LAPS) {
                            this.lap = MAX_LAPS;
                            this.speed = 0;
                            this.maxSpeed = 0;
                            setTimeout(() => {
                                const total = this.lapTimes.reduce((a,b)=>a+b,0).toFixed(1);
                                alert(`🏁 Финиш! Круги: ${this.lapTimes.map(t=>t.toFixed(1)+'с').join(', ')}\nОбщее: ${total}с`);
                            }, 200);
                        }
                    }
                    this.trackProgress = newProgress;
                }
            }

            showCrashEffect() {
                const div = document.createElement('div');
                div.className = 'crash-effect';
                div.textContent = '💥';
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 800);
            }
        }

        // ========== ИИ (ПОЛНЫЙ) ==========
        class AIController {
            constructor(car, config) {
                this.car = car;
                this.steerSmooth = 0;
                this.laneOffset = config.startLane || (Math.random() - 0.5) * 12;
                this.personality = config.type || 'racer';
                this.aggression = config.aggression || 0.65;
                this.laneChangeRate = config.laneChangeRate || 0.008;
                this.overtakeCooldown = 0;
                this.safeMargin = 5.0;
                this.targetLane = this.laneOffset;
                this.stuckTimer = 0;
                this.lastPosition = this.car.position.clone();
            }

            update(dt, allCars) {
                const baseIdx = this.car.findClosestPathIndex();
                const speed = this.car.speed;
                const lookAhead = 20 + speed * 0.7;
                const maxLane = TRACK_WIDTH/2 - this.safeMargin;

                const moved = this.car.position.distanceTo(this.lastPosition);
                if (moved < 1.5) this.stuckTimer += dt; else this.stuckTimer = 0;
                this.lastPosition.copy(this.car.position);
                if (this.stuckTimer > 1.0) {
                    this.targetLane = (Math.random() - 0.5) * maxLane * 1.8;
                    this.stuckTimer = 0;
                }

                const forwardPos = this.car.position.clone().add(
                    new THREE.Vector3(Math.sin(this.car.angle), 0, Math.cos(this.car.angle)).multiplyScalar(lookAhead)
                );
                let nearestBlock = null, nearestBlockDist = Infinity;
                for (const other of allCars) {
                    if (other === this.car) continue;
                    const dist = forwardPos.distanceTo(other.position);
                    if (dist < 15 && other.speed < speed - 3) {
                        if (dist < nearestBlockDist) { nearestBlockDist = dist; nearestBlock = other; }
                    }
                }

                if (nearestBlock && this.overtakeCooldown <= 0) {
                    const leftLane = this.laneOffset + 6.5;
                    const rightLane = this.laneOffset - 6.5;
                    let leftTraf = 0, rightTraf = 0;
                    for (const other of allCars) {
                        if (other === this.car || !other.ai) continue;
                        if (Math.abs(other.ai.laneOffset - leftLane) < 4) leftTraf++;
                        if (Math.abs(other.ai.laneOffset - rightLane) < 4) rightTraf++;
                    }
                    this.targetLane = leftTraf <= rightTraf ? leftLane : rightLane;
                    this.targetLane = THREE.MathUtils.clamp(this.targetLane, -maxLane, maxLane);
                    this.overtakeCooldown = 0.6;
                } else {
                    this.overtakeCooldown -= dt;
                    if (Math.random() < this.laneChangeRate * this.aggression) {
                        if (this.personality === 'drifter') {
                            this.targetLane += (Math.random() - 0.5) * 3;
                        } else {
                            this.targetLane = (Math.random() - 0.5) * 14;
                        }
                        this.targetLane = THREE.MathUtils.clamp(this.targetLane, -maxLane, maxLane);
                    }
                }

                this.laneOffset += (this.targetLane - this.laneOffset) * Math.min(1, 3.5 * dt);
                this.laneOffset = THREE.MathUtils.clamp(this.laneOffset, -maxLane, maxLane);

                const targetIdx = (baseIdx + Math.floor(lookAhead / 1.8)) % trackPath.length;
                let targetPoint = trackPath[targetIdx].clone();
                const dir = new THREE.Vector3().subVectors(trackPath[(targetIdx+1)%trackPath.length], trackPath[targetIdx]).normalize();
                const perp = new THREE.Vector3(-dir.z, 0, dir.x);
                targetPoint.add(perp.clone().multiplyScalar(this.laneOffset));

                const dx = targetPoint.x - this.car.position.x;
                const dz = targetPoint.z - this.car.position.z;
                const targetAngle = Math.atan2(dx, dz);
                let diff = targetAngle - this.car.angle;
                while (diff > Math.PI) diff -= Math.PI*2;
                while (diff < -Math.PI) diff += Math.PI*2;

                const steerStrength = 2.0 + this.aggression * 1.3;
                this.steerSmooth += (THREE.MathUtils.clamp(diff * steerStrength, -0.95, 0.95) - this.steerSmooth) * (4 + this.aggression*4) * dt;
                this.car.steerAngle = this.steerSmooth;

                const speedFactor = 1 - Math.abs(diff) * 0.28;
                let desiredSpeed = this.car.maxSpeed * speedFactor;
                if (this.personality === 'defender' && nearestBlock) desiredSpeed *= 0.9;
                if (this.car.speed < desiredSpeed) this.car.speed += this.car.acceleration * dt;
                else this.car.speed -= this.car.friction * dt;

                for (const other of allCars) {
                    if (other === this.car) continue;
                    const dist = this.car.position.distanceTo(other.position);
                    if (dist < 16 && other.speed > this.car.speed) {
                        this.car.speed += 8 * dt;
                    }
                }

                if (this.personality === 'blocker' && this.car.speed > 40) {
                    const player = allCars.find(c => c.isPlayer);
                    if (player) {
                        const toPlayer = new THREE.Vector3().subVectors(player.position, this.car.position);
                        const distToPlayer = toPlayer.length();
                        if (distToPlayer < 25 && player.speed > this.car.speed) {
                            const playerDir = new THREE.Vector3(Math.sin(player.angle), 0, Math.cos(player.angle));
                            const dot = toPlayer.normalize().dot(playerDir);
                            if (dot > 0.6) {
                                this.targetLane = player.ai ? player.ai.laneOffset : 0;
                                this.targetLane = THREE.MathUtils.clamp(this.targetLane, -maxLane, maxLane);
                            }
                        }
                    }
                }
            }
        }

        // ========== СИСТЕМА ЧАСТИЦ (ПЫЛЬ/ИСКРЫ) ==========
        const particleCount = 400;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleColors = new Float32Array(particleCount * 3);
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
        const particleMat = new THREE.PointsMaterial({
            size: 1.5,
            map: new THREE.TextureLoader().load('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAFklEQVQYlWNg+M9Qz0AE/4H4PxBuAwAK1QxRpAAAAAElFTkSuQmCC'),
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            vertexColors: true,
            transparent: true,
            opacity: 0.7,
        });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);
        const particleVelocities = new Float32Array(particleCount * 3);
        const particleLife = new Float32Array(particleCount);

        function emitParticle(pos, vel, color, life = 1.5) {
            for (let i = 0; i < particleCount; i++) {
                if (particleLife[i] <= 0) {
                    particlePositions[i*3] = pos.x; particlePositions[i*3+1] = pos.y; particlePositions[i*3+2] = pos.z;
                    particleVelocities[i*3] = vel.x; particleVelocities[i*3+1] = vel.y; particleVelocities[i*3+2] = vel.z;
                    particleColors[i*3] = ((color>>16)&255)/255; particleColors[i*3+1] = ((color>>8)&255)/255; particleColors[i*3+2] = (color&255)/255;
                    particleLife[i] = life;
                    return;
                }
            }
        }

        function updateParticles(dt) {
            for (let i = 0; i < particleCount; i++) {
                if (particleLife[i] > 0) {
                    particleLife[i] -= dt;
                    if (particleLife[i] <= 0) {
                        particlePositions[i*3+1] = -999;
                    } else {
                        particlePositions[i*3] += particleVelocities[i*3] * dt;
                        particlePositions[i*3+1] += particleVelocities[i*3+1] * dt;
                        particlePositions[i*3+2] += particleVelocities[i*3+2] * dt;
                    }
                }
            }
            particleGeo.attributes.position.needsUpdate = true;
            particleGeo.attributes.color.needsUpdate = true;
        }

        // ========== ИНИЦИАЛИЗАЦИЯ МАШИН ==========
        const playerCar = createDetailedCar(0xff5500);
        scene.add(playerCar);
        const player = new CarPhysics(playerCar, true);
        const startPos = trackPath[0].clone();
        startPos.z += 12;
        player.position.copy(startPos);
        player.angle = 0;

        const aiCars = [];
        const aiColors = [0x3399ff, 0x33cc33, 0xffaa00, 0xdd44dd, 0x00ccff, 0xff6644, 0x88aaff, 0xcc44aa];
        const personalities = [
            { type: 'racer', aggression: 0.95, laneChangeRate: 0.014, startLane: 5.0 },
            { type: 'defender', aggression: 0.4, laneChangeRate: 0.003, startLane: -6.0 },
            { type: 'drifter', aggression: 0.7, laneChangeRate: 0.02, startLane: -3.0 },
            { type: 'blocker', aggression: 0.6, laneChangeRate: 0.008, startLane: 2.5 },
            { type: 'racer', aggression: 0.9, laneChangeRate: 0.016, startLane: 6.5 },
            { type: 'drifter', aggression: 0.75, laneChangeRate: 0.018, startLane: -4.5 },
            { type: 'defender', aggression: 0.45, laneChangeRate: 0.004, startLane: 3.5 },
            { type: 'blocker', aggression: 0.65, laneChangeRate: 0.009, startLane: -2.0 },
        ];

        for (let i = 0; i < aiColors.length; i++) {
            const aiMesh = createDetailedCar(aiColors[i]);
            scene.add(aiMesh);
            const ai = new CarPhysics(aiMesh, false, personalities[i]);
            const offsetIdx = Math.floor((i + 1) * trackPath.length / (aiColors.length + 1));
            const basePos = trackPath[offsetIdx].clone();
            basePos.x += (Math.random() - 0.5) * 25;
            basePos.z += (Math.random() - 0.5) * 25;
            ai.position.copy(basePos);
            ai.angle = Math.atan2(trackPath[(offsetIdx+1)%trackPath.length].x - basePos.x, trackPath[(offsetIdx+1)%trackPath.length].z - basePos.z);
            aiCars.push(ai);
        }

        // ========== КОЛЛИЗИИ ==========
        function handleCarCollisions() {
            const all = [player, ...aiCars];
            for (let i = 0; i < all.length; i++) {
                for (let j = i + 1; j < all.length; j++) {
                    const a = all[i], b = all[j];
                    const dist = a.position.distanceTo(b.position);
                    if (dist < 5.0) {
                        const normal = new THREE.Vector3().subVectors(a.position, b.position).normalize();
                        const overlap = 5.0 - dist;
                        a.position.add(normal.clone().multiplyScalar(overlap * 0.5));
                        b.position.add(normal.clone().multiplyScalar(-overlap * 0.5));
                        const relSpeed = a.speed - b.speed;
                        a.speed -= relSpeed * 0.28;
                        b.speed += relSpeed * 0.28;
                        if ((a.isPlayer || b.isPlayer) && Math.abs(relSpeed) > 12) {
                            const victim = a.isPlayer ? a : b;
                            if (!victim.crashed) {
                                victim.crashed = true;
                                victim.crashTimer = 0.15;
                                victim.showCrashEffect();
                            }
                        }
                    }
                }
            }
        }

        // ========== КАМЕРА ==========
        function updateCamera() {
            const speedFactor = Math.abs(player.speed) * 0.1;
            const behind = new THREE.Vector3(
                player.position.x - Math.sin(player.angle) * (7.5 + speedFactor),
                player.position.y + 6 + speedFactor * 0.5,
                player.position.z - Math.cos(player.angle) * (7.5 + speedFactor)
            );
            const lookAt = new THREE.Vector3(
                player.position.x + Math.sin(player.angle) * 16,
                player.position.y + 1.6,
                player.position.z + Math.cos(player.angle) * 16
            );
            camera.position.lerp(behind, 0.08);
            camera.lookAt(lookAt);
        }

        // ========== МИНИКАРТА ==========
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');
        function drawMinimap() {
            minimapCtx.clearRect(0, 0, 200, 200);
            minimapCtx.fillStyle = 'rgba(0,0,0,0.8)';
            minimapCtx.beginPath(); minimapCtx.arc(100, 100, 98, 0, 2*Math.PI); minimapCtx.fill();
            const scale = 0.15;
            minimapCtx.strokeStyle = '#555'; minimapCtx.lineWidth = 18;
            minimapCtx.beginPath();
            for (let i = 0; i < trackPath.length; i++) {
                const p = trackPath[i];
                const sx = 100 + p.x * scale, sy = 100 + p.z * scale;
                if (i === 0) minimapCtx.moveTo(sx, sy);
                else minimapCtx.lineTo(sx, sy);
            }
            minimapCtx.closePath(); minimapCtx.stroke();
            aiCars.forEach(ai => {
                minimapCtx.fillStyle = '#88ccff'; minimapCtx.beginPath();
                minimapCtx.arc(100 + ai.position.x*scale, 100 + ai.position.z*scale, 5, 0, 2*Math.PI);
                minimapCtx.fill();
            });
            minimapCtx.fillStyle = '#ff5500'; minimapCtx.beginPath();
            minimapCtx.arc(100 + player.position.x*scale, 100 + player.position.z*scale, 6.5, 0, 2*Math.PI);
            minimapCtx.fill();
            const px = 100 + player.position.x*scale, py = 100 + player.position.z*scale;
            minimapCtx.strokeStyle = '#ff5500'; minimapCtx.lineWidth = 4;
            minimapCtx.beginPath();
            minimapCtx.moveTo(px, py);
            minimapCtx.lineTo(px + Math.sin(player.angle)*12, py + Math.cos(player.angle)*12);
            minimapCtx.stroke();
        }

        // ========== УПРАВЛЕНИЕ ==========
        const input = { forward: false, backward: false, left: false, right: false, brake: false };
        window.addEventListener('keydown', e => {
            switch (e.code) {
                case 'ArrowUp': case 'KeyW': input.forward = true; e.preventDefault(); break;
                case 'ArrowDown': case 'KeyS': input.backward = true; e.preventDefault(); break;
                case 'ArrowLeft': case 'KeyA': input.left = true; e.preventDefault(); break;
                case 'ArrowRight': case 'KeyD': input.right = true; e.preventDefault(); break;
                case 'Space': input.brake = true; e.preventDefault(); break;
            }
        });
        window.addEventListener('keyup', e => {
            switch (e.code) {
                case 'ArrowUp': case 'KeyW': input.forward = false; break;
                case 'ArrowDown': case 'KeyS': input.backward = false; break;
                case 'ArrowLeft': case 'KeyA': input.left = false; break;
                case 'ArrowRight': case 'KeyD': input.right = false; break;
                case 'Space': input.brake = false; break;
            }
        });
        document.getElementById('restart').addEventListener('click', () => {
            player.position.copy(startPos);
            player.angle = 0; player.speed = 0; player.steerAngle = 0;
            player.lap = 1; player.lapTimes = [];
            player.lapStartTime = performance.now() / 1000;
            player.trackProgress = 0;
            player.maxSpeed = PLAYER_MAX_SPEED;
            player.crashed = false;
            aiCars.forEach((ai, i) => {
                const offsetIdx = Math.floor((i + 1) * trackPath.length / (aiCars.length + 1));
                const basePos = trackPath[offsetIdx].clone();
                basePos.x += (Math.random() - 0.5) * 25;
                basePos.z += (Math.random() - 0.5) * 25;
                ai.position.copy(basePos);
                ai.speed = 20 + Math.random() * 50;
                ai.angle = Math.atan2(trackPath[(offsetIdx+1)%trackPath.length].x - basePos.x, trackPath[(offsetIdx+1)%trackPath.length].z - basePos.z);
                ai.maxSpeed = AI_MAX_SPEED_BASE + Math.random() * AI_SPEED_VARIATION;
                if (ai.ai) ai.ai.laneOffset = (Math.random() - 0.5) * 12;
            });
        });

        // ========== ГЛАВНЫЙ ЦИКЛ ==========
        const clock = new THREE.Clock();
        const allCars = [player, ...aiCars];
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            player.update(dt, input);
            aiCars.forEach(ai => ai.update(dt, null, allCars));
            handleCarCollisions();

            if (Math.abs(player.speed) > 40) {
                const wheel1 = new THREE.Vector3(1.2, 0.3, -1.8).applyAxisAngle(new THREE.Vector3(0,1,0), player.angle).add(player.position);
                const wheel2 = new THREE.Vector3(-1.2, 0.3, -1.8).applyAxisAngle(new THREE.Vector3(0,1,0), player.angle).add(player.position);
                emitParticle(wheel1, new THREE.Vector3((Math.random()-0.5)*2, Math.random()*2, (Math.random()-0.5)*2), 0xff8800, 0.8);
                emitParticle(wheel2, new THREE.Vector3((Math.random()-0.5)*2, Math.random()*2, (Math.random()-0.5)*2), 0xff8800, 0.8);
            }
            updateParticles(dt);
            updateCamera();
            drawMinimap();
            document.getElementById('lap').textContent = Math.min(player.lap, MAX_LAPS);
            document.getElementById('speed').textContent = Math.abs(Math.round(player.speed * 1.5)) + ' км/ч';
            if (player.lapTimes.length) {
                document.getElementById('best').textContent = Math.min(...player.lapTimes).toFixed(1);
            } else {
                document.getElementById('best').textContent = '--';
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        console.log('✅ Стабильная версия гонки готова!');
        animate();
    </script>
</body>
